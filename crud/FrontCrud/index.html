<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.3.1/dist/css/bootstrap.min.css" integrity="sha384-ggOyR0iXCbMQv3Xipma34MD+dH/1fQ784/j6cY/iJTQUOhcWr7x9JvoRxT2MZw1T" crossorigin="anonymous">
    <link rel="stylesheet" href="index.css">
    <title>Registro Empleados</title>
</head>
<body>
    <div class="container-fluid p-5">
        <h1 class="text-center">Registro de Empleados</h1>
    </div>

    <div class="container-fluid ">
        <div class="d-flex justify-content-center">
            <input type="button"  id="myBtn" value="Agregar Empleado" class="btn btn-success p-2 w-75">
        </div>
        <div class="table-responsive">
            <table class="table w-75 mx-auto my-4">
                <thead>
                    <tr>
                        <th class="header-title" scope="col"><input type="checkbox" id="selectAll"></th>
                        <th class="header-title" scope="col">#</th>
                        <th class="header-title" scope="col">Nombre</th>
                        <th class="header-title" scope="col">Correo</th>
                        <th class="header-title" scope="col">Dirección</th>
                        <th class="header-title" scope="col">Número Telefónico</th>
                        <th class="header-title" scope="col">Acciones</th>
                    </tr>
                </thead>
            <tbody id="tablaProductos">
            </tbody>
            </table>
            <div class="delete-selected">
                <button type="button" id="deleteSelected" class="btn btn-danger">Eliminar Seleccionados</button>
            </div>
        </div>
    </div>

    <div id="validationErrorModal" class="modal">
        <div class="modal-alert">
            <span class="close-alert">&times;</span> <br>
            <h2 class="error-title">Error</h2>
            <p>Todos los campos son obligatorios.</p>
        </div>
    </div>

    <div id="myModal" class="modal">
        <!-- Modal content -->
        <div class="modal-content">
            <span class="close">&times;</span>
            <div>
                <div>
                    <div class="border-bottom border-success mb-4">
                        <h2 class="text-center py-4" id="modalTitle"></h2>
                    </div>
                </div>
                <div>
                    <form>
                        <div class="form-row">
                            <div class="form-group col-md-6">
                                <label htmlFor="inputEmail4">Nombre</label>
                                <input type="text" class="form-control" id="name" placeholder="Nombre">
                            </div>
                            <div class="form-group col-md-6">
                                <label htmlFor="inputPassword4">Dirección</label>
                                <input type="text" class="form-control" id="address" placeholder="Correo">
                            </div>
                            <div class="form-group col-md-6">
                                <label htmlFor="inputEmail4">Email</label>
                                <input type="text" class="form-control" id="email" placeholder="Email">
                            </div>
                            <div class="form-group col-md-6">
                                <label htmlFor="inputphoneNumber4">Número Telefónico</label>
                                <input type="number" class="form-control" id="phoneNumber" placeholder="Número Telefónico">
                            </div>
                        </div>
                        <button type="button" id="btnGuardar"class="btn btn-success">Guardar</button>
                    </form>
                </div>
          </div>
        </div>
    </div>
     <script src="index.js"></script>
</body>
</html>
